name: Assign Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const map = { 'razyogev': 'razyogevus-rgb', 'razyogevus-rgb': 'razyogev' };
            const reviewer = map[context.payload.pull_request.user.login];
            if (!reviewer) {
              core.info('Author not in reviewer map; skipping');
              return;
            }
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [reviewer],
            });
            core.info(`Requested review from ${reviewer}`);
